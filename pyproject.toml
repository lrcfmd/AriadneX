[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadnex"
version = "0.1.0"
description = "Portable PXRD library construction and anomaly-aware unmixing workflow"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
ariadnex = "ariadnex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ariadnex = ["encoder.instprm"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

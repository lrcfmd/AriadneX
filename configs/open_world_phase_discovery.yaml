schema_version: 1

project:
  name: open_world_phase_discovery
  output_root: ../runs

# Paths are resolved relative to this file.
inputs:
  phase_manifest: ../data/local_examples/open_world_phase_discovery/raw_phases.csv
  mixtures: ../data/open_world_phase_discovery/samples.csv
  instrument: ../data/open_world_phase_discovery/experimental.instprm
  ground_truth: ../data/open_world_phase_discovery/ground_truth.csv

model:
  checkpoint: ../models/last.ckpt

library:
  profile: open_world_phase_discovery
  filter:
    # Exclude CIFs whose _audit_creation_date is later than this date.
    # Missing or unparseable dates pass this check. Set null to disable it.
    audit_creation_date_cutoff: "2024-01-01"
  simulation:
    # Candidate clustering follows the source-library simulation
    # instrument; selected basis regeneration below defaults to inputs.instrument.
    instrument: ../data/open_world_phase_discovery/candidate_library.instprm
    # Candidate simulation and checkpoint embedding share the full training grid.
    theta_min: 5.0
    theta_max: 90.0
    gridpoints: 4096
  basis_simulation:
    # Selected basis files are regenerated on the experimental window at 0.02°.
    theta_min: 15.0
    theta_max: 75.0
    gridpoints: 3001
  embedding:
    theta_min: 5.0
    theta_max: 90.0
    gridpoints: 4096
    feature_space: raw_cls
    distance: cosine
    normalization: l2
    batch_size: 64
  clustering:
    selection: stable_auto
    min_ari: 0.96
    stable_regime:
      interval_selection: penultimate
    stability:
      repeats: 50
      sample_fraction: 0.8
      random_seed: 42

mixtures:
  profile: open_world_phase_discovery

unmix:
  profile: open_world_phase_discovery
  allow_anomaly: true
  element_prior:
    enabled: true
    considered_elements: [Ba, Y, Ru, Si]
  preprocessing:
    background:
      basis: psalsa
      mixture: none
    theta_min: 15.0
    theta_max: 75.0
    gridpoints: 0
    signature_points: 72
    signature_reduce_mode: dp_sse
    center: false
    smooth: false
    denoise:
      basis: savgol
      mixture: savgol
      window: 7
      polyorder: 2
    signature_cleaning:
      basis: none
      mixture:
        mode: adaptive_noise
        keep_top_k: 16
        min_components: 40
        unsupported_strength_mult: 1.2
        strong_quantile_low_snr: 0.85
        strong_quantile_high_snr: 0.80
  solver:
    formulation: milp
    phase_order_manifest: ../data/open_world_phase_discovery/basis_order.csv
    max_base: auto
    resolution: 0.02
    beta: 2.5
    soft_sparse_penalty: 0.125
    missing_element_penalty: 0.0
    width_prior_mode: inst_width_tau_v1
    delta_tau: 1.5
    delta_floor: 0.03
    width_floor_abs: 0.045
    width_budget_mode: global_avg
    strict_solver: true
    threads: 32
    gurobi_threads: 1
    max_base_extra: 0

experiment:
  type: standard

reports:
  profile: final_required_v1
  phase_recovery: true
  anomaly: true
  reconstruction_sigma: auto
  fingerprint_sigma: auto
